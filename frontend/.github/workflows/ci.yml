name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @the-garden/frontend lint

      - name: Typecheck
        run: pnpm --filter @the-garden/frontend typecheck

      - name: Test
        run: pnpm --filter @the-garden/frontend test

      - name: Build
        run: pnpm --filter @the-garden/frontend build

  backend:
    name: Backend (build · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: the_garden
          POSTGRES_USER: the_garden
          POSTGRES_PASSWORD: the_garden
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U the_garden -d the_garden"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: the_garden
          DB_USERNAME: the_garden
          DB_PASSWORD: the_garden
        run: ./gradlew build
