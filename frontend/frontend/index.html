<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>The Garden</title>
    <meta
      name="description"
      content="A peaceful third-person Christian adventure game. Explore, grow, and discover scripture through seven symbolic worlds."
    />
    <style>
      /* overscroll-behavior: none prevents the WebView's native
         pull-to-refresh/bounce gesture from fighting the joystick and
         camera drag areas. Applied at html/body level, not per
         component, since it's a platform-wide concern. */
      html,
      body {
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        touch-action: none;
        height: 100%;
        width: 100%;
      }
      #root {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
